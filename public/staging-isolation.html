<!doctype html><meta charset="utf-8"><title>CYB staging isolation checks</title>
<h1>Staging isolation checks</h1><p>Uses your current signed-in session. Creates one hidden disposable product per account. No passwords or session tokens are read or stored. Account switching uses normal CYB login.</p>
<button id="capture">Capture account and create test product</button>
<button id="probe">Test access to the other captured account</button>
<button id="verify">Verify own product is unchanged</button>
<a href="/dashboard">Dashboard / switch account</a><pre id="output" aria-live="polite"></pre>
<script>
'use strict';
const out=document.querySelector('#output');
const enabled=location.origin==='https://getcyb-staging-web.onrender.com';
const key='cyb-isolation-20261104-v1';
const api='https://getcyb-staging-api.onrender.com/api/v1';
function log(x){out.textContent+=JSON.stringify(x,null,2)+'\n';}
function state(){return JSON.parse(localStorage.getItem(key)||'{"accounts":{}}');}
function save(s){localStorage.setItem(key,JSON.stringify(s));}
async function request(path,method='GET',body){
 const r=await fetch(api+path,{method,credentials:'include',headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(45000)});
 return {status:r.status,data:await r.json().catch(()=>null)};
}
async function ok(path,method,body){const r=await request(path,method,body);if(r.status<200||r.status>=300)throw Error(path+' returned '+r.status);return r.data;}
async function identity(){const me=await ok('/auth/me'),b=await ok('/businesses/mine');if(!me.id||!b.id||b.ownerId!==me.id)throw Error('Authenticated owner check failed');return {id:me.id,businessId:b.id,name:b.name};}
async function capture(){
 const who=await identity(),s=state();
 if(!s.accounts[who.id]){
  if(Object.keys(s.accounts).length>=2)throw Error('Two accounts already captured');
  const marker='CYB isolation disposable '+crypto.randomUUID();
  const p=await ok('/products','POST',{data:{name:marker,status:'hidden',description:marker,sellingPrice:1,stock:0}});
  if(!p.id||p.businessId!==who.businessId)throw Error('Fixture ownership mismatch');
  s.accounts[who.id]={...who,productId:p.id,marker};
  save(s);
 }
 log({captured:s.accounts[who.id],accountCount:Object.keys(s.accounts).length});
}
async function verify(){
 const who=await identity(),s=state(),own=s.accounts[who.id];if(!own)throw Error('Capture this account first');
 const products=await ok('/products'),p=products.find(p=>p.id===own.productId);
 const pass=!!p&&p.businessId===own.businessId&&p.name===own.marker&&p.data?.description===own.marker;
 s.verifications={...s.verifications,[who.id]:{pass,at:new Date().toISOString()} };save(s);
 log({check:'Own fixture survived cross-account attempts',pass,account:who.name});
}
async function probe(){
 const who=await identity(),s=state(),own=s.accounts[who.id],peer=Object.values(s.accounts).find(x=>x.id!==who.id);
 if(!own||!peer)throw Error('Capture both legitimate accounts first');
 if(!peer.marker.startsWith('CYB isolation disposable '))throw Error('Not a test fixture');
 const results=[];
 for(const path of ['/businesses/mine','/websites/draft','/products']){
  const baseline=await ok(path),r=await request(path+'?businessId='+encodeURIComponent(peer.businessId)+'&ownerId='+encodeURIComponent(peer.id));
  let pass=r.status===200;
  if(path==='/businesses/mine')pass=pass&&r.data?.id===who.businessId&&r.data?.ownerId===who.id;
  if(path==='/websites/draft')pass=pass&&r.data?.businessId===who.businessId&&r.data?.id===baseline?.id;
  if(path==='/products')pass=pass&&Array.isArray(r.data)&&!r.data.some(p=>p.id===peer.productId||p.businessId!==who.businessId)&&r.data.some(p=>p.id===own.productId);
  results.push({check:path+' ignores foreign owner selector',status:r.status,pass});
 }
 for(const method of ['PUT','DELETE']){
  await identity().then(x=>{if(x.id!==who.id)throw Error('Account changed');});
  const r=await request('/products/'+encodeURIComponent(peer.productId),method,method==='PUT'?{data:{name:'Cross-account change must be denied'}}:undefined);
  results.push({check:method+' other account disposable product',status:r.status,pass:r.status===403||r.status===404});
  if(r.status>=200&&r.status<300)break;
 }
 s.runs={...s.runs,[who.id]:{at:new Date().toISOString(),results}};save(s);
 log({account:who.name,target:peer.name,results,note:'These checks cover only listed operations; media, publishing and other routes remain unverified.'});
}
for(const [id,fn] of [['capture',capture],['probe',probe],['verify',verify]]){
 const b=document.getElementById(id);b.disabled=!enabled;
 b.onclick=async()=>{document.querySelectorAll('button').forEach(x=>x.disabled=true);try{if(!enabled)throw Error('Staging only');await fn();}catch(e){log({error:e.message});}finally{document.querySelectorAll('button').forEach(x=>x.disabled=!enabled);}};
}
if(!enabled)log({error:'Disabled outside the exact staging origin'});
</script>
