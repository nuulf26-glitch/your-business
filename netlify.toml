[build]
  command = "npm install --no-audit --no-fund && npm --prefix backend ci --no-audit --no-fund && DATABASE_URL=postgresql://user:pass@127.0.0.1:5432/getcyb npm --prefix backend run prisma:generate && npm run build && npm --prefix backend run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/database", "@prisma/client", "argon2", "@nestjs/microservices", "@nestjs/websockets/socket-module"]
  included_files = ["backend/dist/**", "backend/node_modules/.prisma/**", "backend/node_modules/@prisma/client/**", "backend/node_modules/argon2/**", "node_modules/@netlify/database/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
