name: CYB functional frontend visual QA

on:
  push:
    branches: [codex/cyb-phase3-online-store-20261117, codex/cyb-phase4-crm-20261121, codex/cyb-phase5-analytics-20261121, codex/cyb-phase6-payments-20261122, codex/cyb-cms-core-stacked-20261122, codex/cyb-marketing-automation-stacked-20261122, codex/cyb-memberships-stacked-20261122, codex/cyb-unified-inbox-stacked-20261122, codex/cyb-courses-stacked-20261122, codex/v1-ux-improvements]
  pull_request:
    branches: [codex/cyb-render-integration-20261109, codex/cyb-phase2-editor-20261116, codex/cyb-phase3-online-store-20261117, codex/cyb-phase4-crm-20261121, codex/cyb-phase5-analytics-20261121, codex/cyb-phase12-security-regression-20261122, codex/cyb-conditional-forms-20261122, codex/cyb-cms-core-stacked-20261122, codex/cyb-marketing-automation-stacked-20261122, codex/cyb-memberships-stacked-20261122, codex/cyb-unified-inbox-stacked-20261122, codex/cyb-courses-stacked-20261122, codex/v1-seo-readiness]
    paths:
      - "src/**"
      - "tests/functional-visual/**"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cyb-functional-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyb-functional-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  functional-pages:
    name: Functional pages · responsive screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

      - name: Render functional routes at four viewport sizes
        run: |
          npx playwright test tests/functional-visual/flows.spec.js --grep "editor page management"
          npm run test:functional-visual
        env:
          CI: "true"

      - name: Upload functional screenshots and test results
        id: visual-artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyb-functional-visual-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/functional-visual/
          if-no-files-found: warn
          retention-days: 3

      - name: Add evidence link to run summary
        if: always()
        run: echo "Synthetic functional-route visual QA evidence is available in the workflow artifact." >> "$GITHUB_STEP_SUMMARY"
