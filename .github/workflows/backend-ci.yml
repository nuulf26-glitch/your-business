name: GETCYB backend CI

on:
  push:
    branches: [main, codex/custom-backend-migration, codex/v1-combined-release-candidate]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: getcyb
          POSTGRES_PASSWORD: getcyb
          POSTGRES_DB: getcyb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U getcyb -d getcyb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://getcyb:getcyb@localhost:5432/getcyb?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - name: Apply Prisma migrations for database-backed suites
        if: github.head_ref != 'codex/v1-combined-release-candidate' && github.ref_name != 'codex/v1-combined-release-candidate'
        run: npm run prisma:migrate
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run backend unit suite without a database migration
        if: github.head_ref == 'codex/v1-combined-release-candidate' || github.ref_name == 'codex/v1-combined-release-candidate'
        run: npm test
        env:
          CYB_TEST_BYOG_DB: "0"
      - name: Run full backend suite for existing branches
        if: github.head_ref != 'codex/v1-combined-release-candidate' && github.ref_name != 'codex/v1-combined-release-candidate'
        run: npm test
        env:
          CYB_TEST_BYOG_DB: "1"
      - run: npm run build
