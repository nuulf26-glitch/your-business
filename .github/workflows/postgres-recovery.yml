name: PostgreSQL recovery regression

on:
  pull_request:
    paths:
      - "backend/scripts/postgres-recovery.mjs"
      - "backend/test/postgres-recovery.integration.mjs"
      - "backend/prisma/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/docs/POSTGRES-DISASTER-RECOVERY.md"
      - ".github/workflows/postgres-recovery.yml"
  push:
    branches:
      - codex/cyb-v1-backup-recovery
    paths:
      - "backend/scripts/postgres-recovery.mjs"
      - "backend/test/postgres-recovery.integration.mjs"
      - "backend/prisma/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/docs/POSTGRES-DISASTER-RECOVERY.md"
      - ".github/workflows/postgres-recovery.yml"

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cyb_recovery_test
          POSTGRES_PASSWORD: cyb_recovery_test
          POSTGRES_DB: cyb_recovery_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyb_recovery_test -d cyb_recovery_source"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://cyb_recovery_test:cyb_recovery_test@127.0.0.1:5432/cyb_recovery_source?schema=public
      CYB_RECOVERY_TEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - name: Apply schema to disposable PostgreSQL
        run: npm run prisma:migrate
      - name: Exercise encrypted backup, restore, and corruption recovery
        run: npm run test:postgres-recovery
