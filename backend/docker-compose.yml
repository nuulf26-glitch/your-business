services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: getcyb, POSTGRES_PASSWORD: getcyb, POSTGRES_DB: getcyb }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U getcyb"], interval: 5s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: miniosecret }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata: {}
  miniodata: {}
