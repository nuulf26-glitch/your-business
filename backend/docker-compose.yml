services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: getcyb, POSTGRES_PASSWORD: getcyb, POSTGRES_DB: getcyb }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U getcyb"], interval: 5s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: miniosecret }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 minio miniosecret; do sleep 2; done;
      mc mb --ignore-existing local/getcyb-assets;
      mc anonymous set download local/getcyb-assets;
      mc cors set local/getcyb-assets /cors.json
    volumes: ["./infra/s3-cors.json:/cors.json:ro"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata: {}
  miniodata: {}
