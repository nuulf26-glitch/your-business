services:
  - type: web
    name: cyb-production-web
    runtime: static
    repo: https://github.com/nuulf26-glitch/your-business
    branch: codex/cyb-render-integration-20261109
    buildCommand: npm install --no-audit --no-fund && npm --prefix backend ci --no-audit --no-fund && DATABASE_URL=postgresql://user:pass@127.0.0.1:5432/getcyb npm --prefix backend run prisma:generate && mkdir -p node_modules/.prisma && cp -R backend/node_modules/.prisma/client node_modules/.prisma/ && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
